name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: PHP syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tests
        run: vendor/bin/phpunit

  bolt:
    # Installs the extension in a real Bolt CMS site in Docker and checks the tag.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify in Bolt CMS
        run: ./scripts/verify-docker.sh
